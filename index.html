<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes App</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
      min-height: 100vh;
      padding: 20px;
      transition: background 0.3s, color 0.3s;
    }
    h1 {
      text-align: center;
      font-family: 'Pacifico', cursive;
      font-size: 2.5rem;
      color: #333;
      margin-bottom: 20px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
    }
    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
      transition: background 0.3s, color 0.3s;
    }
    textarea, input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
      resize: none;
      transition: background 0.3s, color 0.3s;
    }
    button {
      padding: 10px 15px;
      background: #007bff;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #0056b3;
    }
    .note {
      background: #fafafa;
      border: 1px solid #ddd;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      position: relative;
      transition: transform 0.2s, background 0.3s, color 0.3s;
    }
    .note:hover {
      transform: scale(1.02);
    }
    .note button {
      position: absolute;
      top: 8px;
      right: 8px;
      background: crimson;
      border: none;
      border-radius: 5px;
      padding: 5px 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .note .edit-btn {
      right: 50px;
      background: orange;
    }
    .toggle-btn {
      display: block;
      margin: 0 auto 20px auto;
      background: #333;
    }
    /* 🌙 Dark Mode */
    body.dark {
      background: linear-gradient(135deg, #232526, #414345);
      color: #eee;
    }
    body.dark .container {
      background: #2c2c2c;
      color: #eee;
    }
    body.dark textarea,
    body.dark input {
      background: #444;
      color: #fff;
      border: 1px solid #666;
    }
    body.dark .note {
      background: #333;
      border: 1px solid #555;
      color: #eee;
    }
    body.dark .toggle-btn {
      background: #eee;
      color: #333;
    }
  </style>
</head>
<body>

  <h1>📝 My Fancy Notes</h1>
  <div class="container">
    <button class="toggle-btn" onclick="toggleDarkMode()">🌙 Toggle Dark Mode</button>
    <input type="text" id="searchInput" placeholder="🔍 Search notes..." onkeyup="searchNotes()">
    <textarea id="noteInput" placeholder="Write your note..."></textarea>
    <button onclick="addNote()">Add Note</button>

    <div id="notesContainer"></div>
  </div>

  <script>
    let editIndex = -1;

    window.onload = () => {
      loadNotes();
      if (localStorage.getItem("darkMode") === "true") {
        document.body.classList.add("dark");
      }
    };

    function addNote() {
      const noteInput = document.getElementById("noteInput");
      const noteText = noteInput.value.trim();

      if (noteText === "") {
        alert("Please write something!");
        return;
      }

      let notes = JSON.parse(localStorage.getItem("notes")) || [];

      if (editIndex === -1) {
        notes.push(noteText);
      } else {
        notes[editIndex] = noteText;
        editIndex = -1;
      }

      localStorage.setItem("notes", JSON.stringify(notes));
      noteInput.value = "";
      loadNotes();
    }

    function loadNotes() {
      const notesContainer = document.getElementById("notesContainer");
      notesContainer.innerHTML = "";

      const notes = JSON.parse(localStorage.getItem("notes")) || [];
      notes.forEach((note, index) => {
        const noteDiv = document.createElement("div");
        noteDiv.className = "note";
        noteDiv.innerHTML = `
          <p>${note}</p>
          <button onclick="deleteNote(${index})">❌</button>
          <button class="edit-btn" onclick="editNote(${index})">✏️</button>
        `;
        notesContainer.appendChild(noteDiv);
      });
    }

    function deleteNote(index) {
      let notes = JSON.parse(localStorage.getItem("notes")) || [];
      notes.splice(index, 1);
      localStorage.setItem("notes", JSON.stringify(notes));
      loadNotes();
    }

    function editNote(index) {
      let notes = JSON.parse(localStorage.getItem("notes")) || [];
      document.getElementById("noteInput").value = notes[index];
      editIndex = index;
    }

    function searchNotes() {
      let input = document.getElementById("searchInput").value.toLowerCase();
      let notes = document.getElementsByClassName("note");

      Array.from(notes).forEach(note => {
        let text = note.innerText.toLowerCase();
        note.style.display = text.includes(input) ? "block" : "none";
      });
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark");
      localStorage.setItem("darkMode", document.body.classList.contains("dark"));
    }
  </script>

</body>
</html>
